{% extends "base.html" %}{% block content %}
<h1>Attendance</h1>
<a href="{% url 'attendance:add' %}">Record attendance</a>
<ul>
  {% for r in records %}
  <li>
    {{ r.date }} — {{ r.student }} — {{ r.subject }} — {{ r.get_status_display
    }}
  </li>
  {% empty %}
  <li>No records found.</li>
  {% endfor %}
</ul>
{% endblock %}
