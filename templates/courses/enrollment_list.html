{% extends "base.html" %}{% block content %}
<h1>Enrollments</h1>
<a href="{% url 'courses:enrollment_add' %}">Add enrollment</a>
<ul>
  {% for e in enrollments %}
  <li>
    {{ e.student }} — {{ e.course }} — {{ e.academic_year }} ({{ e.status }})
  </li>
  {% empty %}
  <li>No enrollments found.</li>
  {% endfor %}
</ul>
{% endblock %}
